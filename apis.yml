aid: voicegenie
name: VoiceGenie
description: >-
  VoiceGenie (Ori Labs Ltd.) is a conversational voice AI platform for sales automation that lets
  teams deploy AI voice agents to run outbound and inbound phone calls end to end. Businesses build
  assistants (voice bots) with a chosen voice, language, script and knowledge base, attach a phone
  number (via Twilio or Plivo), upload contact lists, and launch campaigns that qualify leads, book
  meetings, send SMS, run surveys, chase payment reminders, and hand off to human agents when needed.
  VoiceGenie exposes a Public REST API on core-saas.voicegenie.ai for placing calls, adding calls to
  recurring campaigns, pausing/resuming campaigns, fetching call analysis and status, retrieving
  inbound-call updates, checking transfer status, and removing customers from campaigns, plus a
  post-call analysis webhook, so voice workflows can be automated from n8n, Zapier, Zoho Flow,
  HubSpot, HighLevel, Cal.com and custom applications.
