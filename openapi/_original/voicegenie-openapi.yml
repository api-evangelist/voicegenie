# source: https://voicegenie.gitbook.io/voicegenie-ai/developer-documentation-1.0 + /integrations/public-api-integration
openapi: 3.0.3
info:
  title: VoiceGenie Public REST API
  version: '1.0'
  description: >-
    The VoiceGenie Public REST API lets you automate voice workflows by connecting VoiceGenie to
    external tools like n8n, Zoho Flow, Zapier, or custom applications. You can programmatically
    place calls, add calls to recurring campaigns, pause/resume campaigns, fetch call analysis and
    status, retrieve inbound-call updates, check transfer status, and remove customers from a
    campaign. Authentication is performed by including an API token (apiKey/token) and a workspaceId
    in the JSON request payload; generate the token from the dashboard under Developer APIs / System
    -> APIs. This description was generated from VoiceGenie's public developer documentation; request
    and response bodies reflect the documented fields.
  contact:
    name: VoiceGenie Support
    email: support@voicegenie.ai
    url: https://voicegenie.gitbook.io/voicegenie-ai/developer-documentation-1.0
  termsOfService: https://voicegenie.ai/terms
servers:
  - url: https://core-saas.voicegenie.ai
    description: VoiceGenie production API
tags:
  - name: Calls
    description: Place and track voice calls.
  - name: Campaigns
    description: Manage outbound/inbound campaigns and their contacts.
paths:
  /api/v1/pushCallToCampaign:
    post:
      tags: [Campaigns]
      operationId: pushCallToCampaign
      summary: Add a call to a recurring campaign
      description: >-
        Queue a new call for a customer number inside an existing recurring campaign. The token,
        workspaceId, campaignId and customerNumber must be present strings; customerNumber must be in
        E.164 format (leading country code with a plus sign, no spaces, hyphens or brackets).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushCallRequest'
            example:
              token: your-api-token
              workspaceId: your-workspace-id
              campaignId: your-campaign-id
              customerNumber: "+10000000000"
              customerInformation:
                first_name: Yawar
                last_name: Mushtaq
      responses:
        '200':
          description: Call queued to the campaign.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '400':
          description: Validation error (missing field, or malformed customerNumber).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/publicRestApiActions/placeCall:
    post:
      tags: [Calls]
      operationId: placeCall
      summary: Place a call
      description: >-
        Place a call to a customer number using a campaign's configuration. customerNumber must be
        E.164 formatted. Optional customerInformation is passed through as dynamic variables.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceCallRequest'
            example:
              apiKey: your-api-key
              workspaceId: your-workspace-id
              campaignId: your-campaign-id
              customerNumber: "+1234567890"
              customerInformation:
                first_name: John
                last_name: Doe
                email: john@example.com
      responses:
        '200':
          description: Call placed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/publicRestApiActions/callAnalysisOrStatus:
    post:
      tags: [Calls]
      operationId: callAnalysisOrStatus
      summary: Get call analysis or status
      description: >-
        Retrieve the analysis (transcript) or the latest status for a customer call. Set action to
        "analysis" for transcripts or "status" for state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallAnalysisRequest'
            example:
              apiKey: your-api-key
              workspaceId: your-workspace-id
              campaignId: your-campaign-id
              customerNumber: "+1234567890"
              action: analysis
      responses:
        '200':
          description: Call analysis or status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/publicRestApiActions/editCampaign:
    put:
      tags: [Campaigns]
      operationId: editCampaign
      summary: Pause or resume a campaign
      description: Pause or resume a running campaign by specifying the campaignId and desired action.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditCampaignRequest'
            example:
              apiKey: your-api-key
              workspaceId: your-workspace-id
              campaignId: your-campaign-id
              action: pause
      responses:
        '200':
          description: Campaign updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/publicRestApiActions/inboundCallUpdate:
    post:
      tags: [Calls]
      operationId: inboundCallUpdate
      summary: Get inbound calls
      description: Fetch recent inbound-call updates for a campaign to sync with your workflows.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignScopedRequest'
            example:
              apiKey: your-api-key
              workspaceId: your-workspace-id
              campaignId: your-campaign-id
      responses:
        '200':
          description: Inbound-call updates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/publicRestApiActions/checkCallTransferStatus:
    post:
      tags: [Calls]
      operationId: checkCallTransferStatus
      summary: Check transfer status
      description: Check whether a call transfer is pending, completed, or failed for a given campaign.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignScopedRequest'
            example:
              apiKey: your-api-key
              workspaceId: your-workspace-id
              campaignId: your-campaign-id
      responses:
        '200':
          description: Transfer status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/publicRestApiActions/pullCustomerFromCampaign:
    put:
      tags: [Campaigns]
      operationId: pullCustomerFromCampaign
      summary: Remove a customer from a campaign
      description: >-
        Remove a specific customer number from an ongoing campaign to stop further outreach.
        customerNumber must be E.164 formatted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PullCustomerRequest'
            example:
              apiKey: your-api-key
              workspaceId: your-workspace-id
              campaignId: your-campaign-id
              customerNumber: "+1234567890"
      responses:
        '200':
          description: Customer removed from campaign.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    Credentials:
      type: object
      description: Credentials passed in the JSON payload. Use apiKey (public API) or token (campaign API) plus workspaceId.
      properties:
        apiKey:
          type: string
          description: Developer API key (public REST API endpoints).
        token:
          type: string
          description: API token (pushCallToCampaign endpoint).
        workspaceId:
          type: string
          description: Workspace identifier; constant for the account even if the token is regenerated.
    PushCallRequest:
      type: object
      required: [token, workspaceId, campaignId, customerNumber]
      properties:
        token:
          type: string
        workspaceId:
          type: string
        campaignId:
          type: string
        customerNumber:
          type: string
          description: E.164 phone number, e.g. "+10000000000".
        customerInformation:
          $ref: '#/components/schemas/CustomerInformation'
    PlaceCallRequest:
      type: object
      required: [apiKey, workspaceId, campaignId, customerNumber]
      properties:
        apiKey:
          type: string
        workspaceId:
          type: string
        campaignId:
          type: string
        customerNumber:
          type: string
          description: E.164 phone number, e.g. "+1234567890".
        customerInformation:
          $ref: '#/components/schemas/CustomerInformation'
    CallAnalysisRequest:
      type: object
      required: [apiKey, workspaceId, campaignId, customerNumber, action]
      properties:
        apiKey:
          type: string
        workspaceId:
          type: string
        campaignId:
          type: string
        customerNumber:
          type: string
        action:
          type: string
          enum: [analysis, status]
    EditCampaignRequest:
      type: object
      required: [apiKey, workspaceId, campaignId, action]
      properties:
        apiKey:
          type: string
        workspaceId:
          type: string
        campaignId:
          type: string
        action:
          type: string
          enum: [pause, resume]
    CampaignScopedRequest:
      type: object
      required: [apiKey, workspaceId, campaignId]
      properties:
        apiKey:
          type: string
        workspaceId:
          type: string
        campaignId:
          type: string
    PullCustomerRequest:
      type: object
      required: [apiKey, workspaceId, campaignId, customerNumber]
      properties:
        apiKey:
          type: string
        workspaceId:
          type: string
        campaignId:
          type: string
        customerNumber:
          type: string
    CustomerInformation:
      type: object
      description: Optional key/value strings passed through as dynamic variables into the script.
      additionalProperties:
        type: string
      example:
        first_name: John
        last_name: Doe
        email: john@example.com
    GenericResponse:
      type: object
      description: Generic success envelope (shape not fully documented publicly).
      properties:
        success:
          type: boolean
        message:
          type: string
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
