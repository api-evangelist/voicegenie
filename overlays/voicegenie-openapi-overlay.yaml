overlay: 1.0.0
info:
  title: API Evangelist enhancements for VoiceGenie Public REST API
  version: 1.0.0
extends: openapi/voicegenie-openapi.yml
actions:
- target: $.info
  update:
    x-apievangelist-enriched: '2026-07-21'
    x-api-evangelist-provider: voicegenie
    x-authentication: authentication/voicegenie-authentication.yml
    x-conventions: conventions/voicegenie-conventions.yml
- target: $.info
  update:
    x-webhooks: asyncapi/voicegenie-webhooks.yml
    x-data-model: data-model/voicegenie-data-model.yml
- target: $.paths['/api/v1/publicRestApiActions/placeCall'].post
  update:
    x-agent-consequence: physical
    x-note: Initiates a live outbound phone call to a real customer number.
- target: $.paths['/api/v1/publicRestApiActions/editCampaign'].put
  update:
    x-agent-consequence: write
    x-note: Pauses or resumes an active calling campaign.
